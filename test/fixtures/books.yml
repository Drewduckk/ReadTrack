one:
  title: "Die Rote Zora"
  author: "Kurt Held"
  content: "Kapitel 1: Der Anfang der Geschichte. Es war einmal ein kleines Dorf am Meer. Seite 1-10 handeln vom Leben an der Küste. Kapitel 2: Die Bande entsteht. Seite 11-20 beschreiben die Abenteuer der Gruppe. Kapitel 3: Der grosse Plan. Seite 21-30 führen zur entscheidenden Wendung."

two:
  title: "Krabat"
  author: "Otfried Preußler"
  content: "Kapitel 1: Die Mühle im Koselbruch. Der Junge Krabat folgt den Raben im Traum. Kapitel 2: Die Lehrzeit beginnt."
